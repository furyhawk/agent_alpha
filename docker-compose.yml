# ──────────────────────────────────────────────────────────────────
#  Agent Alpha — Docker Compose
#
#  Usage:
#    docker compose up -d              # start everything
#    docker compose up -d --build      # rebuild & start
#    docker compose down               # stop & remove
#
#  Requires:
#    - Docker (or Podman with docker-compose compatibility)
#    - An OpenAI-compatible LLM endpoint (set LLM_BASE_URL)
# ──────────────────────────────────────────────────────────────────

services:
  # ── FastAPI Backend ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-alpha-backend
    ports:
      - "8000:8000"
    environment:
      # NOTE: URLs are hardcoded to container service names so that the
      # host .env file (with localhost URLs) does NOT override them.
      - DEBUG=${DEBUG:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8011/v1}
      - LLM_MODEL=${LLM_MODEL:-llama}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://agent_alpha:agent_alpha@postgres:5432/agent_alpha}
      - VALKEY_URL=${VALKEY_URL:-redis://valkey:6379/0}
      # RAG / Milvus
      - MILVUS_URI=${MILVUS_URI:-http://milvus:19530}
      - MILVUS_TOKEN=${MILVUS_TOKEN:-}
      - MEDIA_DIR=${MEDIA_DIR:-/app/media}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}

    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      milvus:
        condition: service_healthy
    # Uncomment to use a local .env file instead of env vars:
    # env_file:
    #   - .env
    # Podman: use host.containers.internal; Docker Desktop: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"

  # ── React Frontend (nginx) ──────────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: agent-alpha-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agent-alpha-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agent_alpha
      POSTGRES_PASSWORD: agent_alpha
      POSTGRES_DB: agent_alpha
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_alpha -d agent_alpha"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Valkey (Redis-compatible) ──────────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: agent-alpha-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Milvus Vector Database ──────────────────────────────────────
  # Requires etcd (coordinator) and MinIO (storage).
  milvus:
    image: milvusdb/milvus:v2.5-latest
    container_name: agent-alpha-milvus
    ports:
      - "19530:19530"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: agent-alpha-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-11-17T22-20-09Z
    container_name: agent-alpha-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Ollama (optional — uncomment to run the LLM locally) ────────
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

volumes:
  postgres_data:
  valkey_data:
  milvus_data:
  etcd_data:
  minio_data:
#   ollama_data:
